name: Release

# Publishes the EXACT release-candidate tarball attached to the GitHub
# release — never a rebuild. Tags are per package: <workspace>-v<version>
# (tronbox-upgrades-v0.1.0, hardhat-tron-upgrades-v0.1.0). Publishing
# prefers npm trusted publishing (OIDC provenance); until the trusted
# publisher is configured on the npm side, the first publish falls back to
# the NPM_TOKEN secret, gated behind the protected `publish` environment.
on:
  release:
    types: [published]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write # npm --provenance (OIDC)

jobs:
  publish:
    if: startsWith(github.event.release.tag_name, 'tronbox-upgrades-v') || startsWith(github.event.release.tag_name, 'hardhat-tron-upgrades-v')
    runs-on: ubuntu-latest
    environment: publish
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          # npm >= 11.5.1 (bundled with Node 24) is required for OIDC trusted
          # publishing; Node 22 ships npm 10.x, which cannot publish via OIDC.
          node-version: 24
          registry-url: https://registry.npmjs.org
      # No `npm ci` here on purpose: every step below works from the repo
      # files and the downloaded tarball alone, so no third-party dependency
      # script ever executes in a job that holds `id-token: write`.
      - name: Resolve the package from the tag
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          PKG_DIR="${TAG%-v*}"
          VERSION="${TAG##*-v}"
          test -f "packages/$PKG_DIR/package.json" || { echo "tag prefix $PKG_DIR names no workspace"; exit 1; }
          PKG_NAME="$(jq -r .name "packages/$PKG_DIR/package.json")"
          {
            echo "PKG_DIR=$PKG_DIR"
            echo "PKG_NAME=$PKG_NAME"
            echo "TAG_VERSION=$VERSION"
          } >> "$GITHUB_ENV"
      - name: Check package publish status
        id: check-package
        run: |
          npm_stderr_file="$RUNNER_TEMP/npm-view.stderr"
          if npm view "$PKG_NAME" version > /dev/null 2> "$npm_stderr_file"; then
            echo "Package already published — using OIDC trusted publishing"
            echo "is_first_publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          npm_error="$(tr '\n' ' ' < "$npm_stderr_file")"
          if [[ "$npm_error" == *"E404"* || "$npm_error" == *"404"* || "$npm_error" == *"Not Found"* ]]; then
            echo "::notice::First publish of $PKG_NAME — will use NPM_TOKEN for publish"
            echo "is_first_publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "::error::npm view failed for $PKG_NAME: ${npm_error:-Unknown error}"
            exit 1
          fi
      - name: Configure npm auth
        env:
          IS_FIRST_PUBLISH: ${{ steps.check-package.outputs.is_first_publish }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ "$IS_FIRST_PUBLISH" = "true" ]; then
            # Not yet registered for OIDC trusted publishing — authenticate with
            # the npm token. setup-node's .npmrc reads it from NODE_AUTH_TOKEN.
            echo "NODE_AUTH_TOKEN=${NPM_TOKEN}" >> "$GITHUB_ENV"
          else
            # Trusted publishing via OIDC. npm only falls through to OIDC when no
            # _authToken is configured, so strip the line setup-node wrote to the
            # npm userconfig.
            if [ -n "${NPM_CONFIG_USERCONFIG:-}" ] && [ -f "$NPM_CONFIG_USERCONFIG" ]; then
              sed -i '/_authToken=/d' "$NPM_CONFIG_USERCONFIG"
            fi
          fi
      - name: Git tag matches the workspace version
        run: |
          VERSION="$(jq -r .version "packages/$PKG_DIR/package.json")"
          test "$TAG_VERSION" = "$VERSION" || { echo "tag version $TAG_VERSION does not match packages/$PKG_DIR v$VERSION"; exit 1; }
      - name: Download the release-candidate assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          mkdir -p rc && cd rc
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern '*.tgz' --pattern '*.tgz.sha256'
          COUNT="$(ls -1 -- *.tgz 2>/dev/null | wc -l)"
          test "$COUNT" -eq 1 || { echo "expected exactly one .tgz release asset, found $COUNT"; exit 1; }
      - name: Tarball is byte-identical to the recorded candidate
        run: |
          cd rc
          sha256sum --check --strict -- *.tgz.sha256
          TGZ="$(ls -1 -- *.tgz)"
          PACKED_NAME="$(tar -xzOf "$TGZ" package/package.json | jq -r .name)"
          PACKED_VERSION="$(tar -xzOf "$TGZ" package/package.json | jq -r .version)"
          test "$PKG_NAME" = "$PACKED_NAME" || { echo "tarball is $PACKED_NAME, tag names $PKG_NAME"; exit 1; }
          test "$TAG_VERSION" = "$PACKED_VERSION" || { echo "tarball version $PACKED_VERSION does not match tag $TAG_VERSION"; exit 1; }
          echo "EXPECTED_INTEGRITY=sha512-$(openssl dgst -sha512 -binary "$TGZ" | base64 -w0)" >> "$GITHUB_ENV"
      - name: Production dependency audit of the tarball (blocking)
        run: |
          # Lock-only resolution of the tarball's own production tree: no
          # dependency script executes, and the root lockfile's development
          # noise never gates a release. Same check the rc ran, re-verified
          # on the exact bytes about to publish.
          TGZ="$(ls -1 rc/*.tgz)"
          mkdir audit-scratch && cd audit-scratch
          jq -n --arg tgz "../$TGZ" '{name: "release-audit", private: true, dependencies: {pkg: ("file:" + $tgz)}}' > package.json
          npm install --package-lock-only --no-audit --no-fund
          npm audit --omit=dev --audit-level=high
      - name: Publish the exact verified bytes
        run: |
          cd rc
          TGZ="$(ls -1 -- *.tgz)"
          VERSION="$(tar -xzOf "$TGZ" package/package.json | jq -r .version)"
          # npm >= 11 requires an explicit --tag for prerelease versions so a
          # prerelease never silently takes over the `latest` dist-tag.
          case "$VERSION" in
            *-*) npm publish "$TGZ" --provenance --access public --tag next ;;
            *)   npm publish "$TGZ" --provenance --access public ;;
          esac
      - name: Registry integrity matches the published file
        run: |
          PUBLISHED=""
          # A first publish can take npm ~15 minutes to serve (measured on
          # @openzeppelin/hardhat-tron 0.1.0), so the window is 40 x 30s.
          for attempt in $(seq 1 40); do
            PUBLISHED="$(npm view "$PKG_NAME@$TAG_VERSION" dist.integrity 2>/dev/null || true)"
            [ -n "$PUBLISHED" ] && break
            sleep 30
          done
          test "$PUBLISHED" = "$EXPECTED_INTEGRITY" || { echo "registry integrity '$PUBLISHED' does not match the published file '$EXPECTED_INTEGRITY'"; exit 1; }
